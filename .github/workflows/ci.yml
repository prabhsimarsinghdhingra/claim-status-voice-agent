name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly: catches upstream dependency drift
  workflow_dispatch:
    inputs:
      run_live:
        description: "Also run live Gemini smoke tests (needs the GEMINI_API_KEY repo secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check --output-format=github .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest # non-blocking: the project targets Linux, this just reports portability
            python: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest + coverage (>= 90% enforced)
        run: >
          pytest -q
          --cov=csva --cov-branch --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90 --junitxml=junit.xml
      - name: Upload coverage + junit
        if: always() && matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  benchmark:
    name: Benchmark gate (rule baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Run all scenarios x5, fail on any regression
        run: python -m csva benchmark --repeats 5 --out benchmark_rules --min-success 1.0 --min-accuracy 1.0
      - name: Publish results to the job summary
        if: always()
        run: cat benchmark_rules.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-rules
          path: benchmark_rules.*

  package:
    name: Build + install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean venv, away from the source tree, and run a call
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/csva run --scenario ivr_denied_medical_necessity
          /tmp/wheel-venv/bin/csva benchmark --min-success 1.0 --min-accuracy 1.0

  live-gemini:
    name: Live Gemini smoke (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CSVA_RPM: "6" # stay inside free-tier rate limits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Require the secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add a GEMINI_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - run: python -m csva doctor
      - run: pytest -m live -o addopts='' -q

  gate:
    name: CI gate (use this as the required check)
    if: always()
    needs: [lint, test, benchmark, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
